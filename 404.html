<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Forticam</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B2540;color:#fff;font:400 18px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
    main{max-width:560px}
    h1{font-size:clamp(30px,6vw,44px);margin:0 0 12px}
    p{margin:0 0 28px;color:#CFE0F1}
    .eyebrow{font:500 13px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#8FC7FF;margin-bottom:12px}
    a{display:inline-block;margin:6px;padding:14px 24px;border-radius:8px;font-weight:700;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.6)}
    a.primary{background:#C2410C;border-color:#C2410C}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Error 404</div>
  <h1>This page does not exist</h1>
  <p>The link may be old or mistyped. Go back to the Forticam home page, or call us on 9217295528.</p>
  <a id="home" class="primary" href="/">Back to home</a>
  <a href="tel:+919217295528">Call 9217295528</a>
</main>
<script>
  // On a github.io project address the site lives in a sub-folder; on a custom domain it is the root.
  (function () {
    var home = document.getElementById('home');
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split('/')[1];
      if (seg) home.href = '/' + seg + '/';
    }
  })();
</script>
</body>
</html>
